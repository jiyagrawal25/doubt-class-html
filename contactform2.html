<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codehelp Contact Us!</title>
</head>
<body>
    <h1>Welcome to CodeHelp!</h1>
    <h2>Contact Us Form</h2>
    <!-- we could make this form using table tag also but we'll make it under form tag for best practice because our browser must know that it is not a table, it is a form -->
     <form action="">

        <label for="name">Name </label>     <!--in for attribute we basically put the id of the particular input tag associated with it -->
        <input type="text" name="name" id="name" placeholder="Enter Your Name">   <!--placeholder attribute is used to display the faded text in the textfield-->
        <!-- both name and id attributes are used for identification  -->
        <!-- id is always unique and name basically tells what particularly we are creating -->
        <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Your Email">   <!--we can also use email as type here-->
        <br>

        <label for="contact">Contact</label>
        <input type="number" name="contact" id="contact">
        <br>

        <label for="gender">Gender</label>
        <select name="gender" id="gender">   <!--select is used to create a dropdown-->
            <option value="select">Select</option>    <!--option tag is used to add the options/entries in the dropdown created-->
            <option value="male">Male</option>  
            <option value="female">female</option>
            <option value="not to say">Not to Say</option>
        </select>
        <br>


        <label for="dob">Date of Birth</label>
        <input type="date" name="date" id="dob">
        <br>


        <label for="rating">Rating</label>
        <input type="radio" name="rating" id="rating1" value="1">         <!--value attribute is the one that will go in the backend-->
        <label for="rating1">1</label>
        <input type="radio" name="rating" id="rating2" value="2">
        <label for="rating2">2</label>
        <input type="radio" name="rating" id="rating3" value="3">
        <label for="rating3">3</label>
        <input type="radio" name="rating" id="rating4" value="4">
        <label for="rating4">4</label>
        <input type="radio" name="rating" id="rating5" value="5">
        <label for="rating5">5</label>
        <input type="radio" name="rating" id="rating6" value="6">
        <label for="rating6">6</label>
        <!-- here the name attribute is valuable as it is telling html that all these radio buttons from 1 to 6 are corresponding to a single element that's the reason if we select any one button then the previous selection (if there) would be erased -->
        <!-- and if we'll keep different names for the name attribute then the browser will treat all the radio buttons as different-different elements and hence we could make multichoice in that case --> <br>
        


        <label for="msg">Enter Your Message</label><br>
        <textarea name="message" id="msg" cols="30" rows="5" placeholder="Write your message!"></textarea>
       <br>



        <input type="submit" name="submit" id="sumit" value="submit">
        <input type="reset" name="reset" id="reset" value="reset">


        <footer>
            <a href="https://www.youtube.com" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_L4BWDRzfzlwM3wQTJ0qFXOkcIqdl0RnuVQ&s" alt="YouTube" width="50" height="50">
            </a>
            <!-- here hyperlink is created using image tag when made in anchor tag -->

            <a href="https://www.instagram.com" target="_blank">
                <img src="https://cdn.pixabay.com/photo/2016/08/09/17/52/instagram-1581266_1280.jpg" alt="Instagram" width="50" height="50">
            </a>

            <a href="https://www.telegram.com" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Telegram_2019_Logo.svg/640px-Telegram_2019_Logo.svg.png" alt="Telegram" width="40" height="50">
            </a>
        </footer>

     </form>
</body>
</html>
